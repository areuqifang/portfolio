<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Qifang Luo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    /* ─── RESET ─────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }

    /* ─── TOKENS ─────────────────────────────────────────────── */
    :root {
      --bg:       #f5f4f0;
      --fg:       #1a1917;
      --muted:    #7a7870;
      --border:   #d8d6d0;
      --hover-bg: #edecea;
      --font-body: 'EB Garamond', Georgia, serif;
      --font-mono: 'DM Mono', monospace;
    }

    /* ─── BASE ─────────────────────────────────────────────── */
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-body);
      font-size: 1rem;
      line-height: 1.6;
      min-height: 100vh;
    }

    a { color: inherit; text-decoration: none; }

    /* ─── NAV ─────────────────────────────────────────────── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      background: var(--bg);
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 22px 40px;
      border-bottom: 1px solid var(--border);
    }

    .nav-name {
      font-family: var(--font-body);
      font-size: 1rem;
      font-weight: 400;
      letter-spacing: 0.01em;
      cursor: pointer;
    }

    .nav-right {
      display: flex;
      gap: 28px;
      align-items: baseline;
    }

    .nav-link {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 300;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      cursor: pointer;
      transition: color 0.2s;
      background: none;
      border: none;
      padding: 0;
    }
    .nav-link:hover,
    .nav-link.active { color: var(--fg); }

    /* ─── LAYOUT ─────────────────────────────────────────────── */
    main {
      padding-top: 65px; /* nav height */
      min-height: 100vh;
    }

    /* ─── PAGE TRANSITIONS ─────────────────────────────────── */
    .page {
      display: none;
      opacity: 0;
      animation: fadein 0.3s ease forwards;
    }
    .page.active { display: block; }
    @keyframes fadein { to { opacity: 1; } }

    /* ─── HOME ─────────────────────────────────────────────── */
    .home-grid {
      display: grid;
      grid-template-columns: 340px 1fr;
      min-height: calc(100vh - 65px);
      border-right: 1px solid var(--border);
    }

    /* About column */
    .about-col {
      padding: 52px 40px;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 40px;
    }

    .col-label {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      font-weight: 300;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 14px;
    }

    .about-text {
      font-size: 1rem;
      line-height: 1.75;
      color: var(--fg);
    }

    .links-list {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .link-row {
      display: flex;
      align-items: baseline;
      gap: 16px;
      padding: 9px 0;
      border-top: 1px solid var(--border);
      transition: color 0.15s;
    }
    .link-row:last-child { border-bottom: 1px solid var(--border); }
    .link-row:hover { color: var(--muted); }

    .link-type {
      font-family: var(--font-mono);
      font-size: 0.62rem;
      font-weight: 300;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      width: 68px;
      flex-shrink: 0;
    }

    .link-val {
      font-size: 0.9rem;
      color: var(--fg);
    }

    /* Index column */
    .index-col {
      padding: 52px 0;
    }

    .section-block {
      margin-bottom: 0;
    }

    .section-label {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      font-weight: 300;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 0 40px 14px;
    }

    .project-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding: 13px 40px;
      border-top: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.15s;
    }
    .project-row:last-child { border-bottom: 1px solid var(--border); }
    .project-row:hover { background: var(--hover-bg); }

    .project-name {
      font-size: 1rem;
      font-weight: 400;
      color: var(--fg);
    }

    .project-year {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      font-weight: 300;
      color: var(--muted);
      letter-spacing: 0.05em;
    }

    .section-spacer { height: 44px; }

    /* ─── PROJECT PAGE ─────────────────────────────────────── */
    .project-header {
      display: flex;
      align-items: baseline;
      gap: 24px;
      padding: 24px 40px;
      border-bottom: 1px solid var(--border);
    }

    .back-btn {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      font-weight: 300;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
      font-family: var(--font-mono);
      transition: color 0.2s;
    }
    .back-btn:hover { color: var(--fg); }

    .project-header-title {
      font-size: 1rem;
      font-weight: 400;
      color: var(--fg);
    }

    .project-header-desc {
      font-size: 0.875rem;
      color: var(--muted);
      margin-left: auto;
      max-width: 320px;
      text-align: right;
      line-height: 1.6;
      font-style: italic;
    }

    /* Horizontal gallery */
    .h-gallery-wrap {
      position: relative;
    }

    .scroll-hint {
      padding: 10px 40px 0;
      font-family: var(--font-mono);
      font-size: 0.62rem;
      font-weight: 300;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .h-gallery {
      display: flex;
      align-items: center;
      gap: 0;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
      height: calc(100vh - 65px - 57px - 28px);
      min-height: 400px;
      cursor: grab;
      padding: 20px 0;
      -webkit-overflow-scrolling: touch;
    }
    .h-gallery::-webkit-scrollbar { display: none; }
    .h-gallery.is-grabbing { cursor: grabbing; }

    .h-photo {
      flex-shrink: 0;
      height: 100%;
      display: flex;
      align-items: center;
      padding: 0 16px;
    }
    .h-photo:first-child { padding-left: 40px; }
    .h-photo:last-child  { padding-right: 40px; }

    .h-photo img {
      height: 100%;
      width: auto;
      max-width: 80vw;
      object-fit: contain;
      display: block;
      /* Render images at full quality */
      image-rendering: auto;
    }

    /* Empty state */
    .empty-state {
      display: flex;
      align-items: center;
      justify-content: center;
      height: calc(100vh - 65px - 57px - 28px);
      min-height: 400px;
      color: var(--muted);
      font-size: 0.875rem;
      font-style: italic;
    }

    /* ─── RESPONSIVE ─────────────────────────────────────────── */
    @media (max-width: 768px) {
      nav { padding: 18px 20px; }
      .home-grid { grid-template-columns: 1fr; }
      .about-col { padding: 32px 20px; border-right: none; border-bottom: 1px solid var(--border); }
      .index-col { padding: 32px 0; }
      .section-label, .project-row, .about-col { padding-left: 20px; padding-right: 20px; }
      .project-header { padding: 18px 20px; flex-wrap: wrap; gap: 10px; }
      .project-header-desc { margin-left: 0; text-align: left; max-width: 100%; }
      .scroll-hint { padding-left: 20px; }
      .h-photo:first-child { padding-left: 20px; }
      .h-photo:last-child  { padding-right: 20px; }
    }
  </style>
</head>
<body>

<!-- ═══ NAV ═══════════════════════════════════════════════════ -->
<nav>
  <span class="nav-name" onclick="showPage('home')">Qifang Luo</span>
  <div class="nav-right">
    <button class="nav-link active" id="nav-index" onclick="showPage('home')">Index</button>
    <button class="nav-link" id="nav-about" onclick="showPage('about')">About</button>
  </div>
</nav>

<!-- ═══ MAIN ══════════════════════════════════════════════════ -->
<main>

  <!-- HOME PAGE -->
  <div class="page active" id="page-home">
    <div class="home-grid">

      <!-- Left: About + Links -->
      <div class="about-col">
        <div>
          <p class="col-label">About</p>
          <p class="about-text">Hello world.</p>
        </div>
        <div>
          <p class="col-label">Contact & Links</p>
          <div class="links-list">
            <!-- ✏️  EDIT: replace with your real links -->
            <a class="link-row" href="mailto:your@email.com">
              <span class="link-type">Email</span>
              <span class="link-val">your@email.com</span>
            </a>
            <a class="link-row" href="https://instagram.com/yourhandle" target="_blank">
              <span class="link-type">Instagram</span>
              <span class="link-val">@yourhandle</span>
            </a>
            <a class="link-row" href="https://yoursubstack.substack.com" target="_blank">
              <span class="link-type">Substack</span>
              <span class="link-val">yoursubstack</span>
            </a>
          </div>
        </div>
      </div>

      <!-- Right: Project index -->
      <div class="index-col">

        <!-- PROJECTS section -->
        <div class="section-block">
          <p class="section-label">Projects</p>
          <!-- ✏️  EDIT: add / remove project rows here -->
          <div class="project-row" onclick="openProject('people-i-know')">
            <span class="project-name">People I Know</span>
            <span class="project-year">2025</span>
          </div>
          <!-- more project rows go here -->
        </div>

        <div class="section-spacer"></div>

        <!-- WORK section -->
        <div class="section-block">
          <p class="section-label">Work</p>
          <!-- ✏️  EDIT: add / remove work rows here -->
          <!-- Example:
          <div class="project-row" onclick="openProject('wedding-client-a')">
            <span class="project-name">Wedding — Client A</span>
            <span class="project-year">2025</span>
          </div>
          -->
          <div class="project-row" style="color: var(--muted); font-style: italic; cursor: default;">
            <span class="project-name" style="font-size: 0.875rem;">Coming soon</span>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- PROJECT PAGE (populated dynamically) -->
  <div class="page" id="page-project">
    <div class="project-header">
      <button class="back-btn" onclick="showPage('home')">← Back</button>
      <span class="project-header-title" id="proj-title"></span>
      <p class="project-header-desc" id="proj-desc"></p>
    </div>
    <div class="h-gallery-wrap">
      <p class="scroll-hint">Drag to browse &nbsp;→</p>
      <div class="h-gallery" id="h-gallery"></div>
    </div>
  </div>

</main>

<!-- ═══ DATA ═══════════════════════════════════════════════════
     ✏️  THIS IS THE ONLY SECTION YOU NEED TO EDIT REGULARLY.
     Add photos by pasting Cloudflare R2 URLs into the photos array.
     Each project needs: id, title, year, description, photos[]
════════════════════════════════════════════════════════════════ -->
<script>
const PROJECTS = [
  {
    id: "people-i-know",
    title: "People I Know",
    year: "2025",
    description: "",
    photos: [
      // ✏️  Paste your Cloudflare R2 image URLs here, one per line:
      // "https://your-r2-bucket.example.com/people-i-know/photo1.jpg",
      // "https://your-r2-bucket.example.com/people-i-know/photo2.jpg",
      https://pub-7cf03843fe354ad1bdbf6460cef97068.r2.dev/junting.jpg
    ]
  },
  // ✏️  Add more projects here following the same structure:
  // {
  //   id: "project-slug",
  //   title: "Project Title",
  //   year: "2024",
  //   description: "A short description.",
  //   photos: ["url1", "url2"]
  // },
];
</script>

<!-- ═══ LOGIC ══════════════════════════════════════════════════ -->
<script>
  /* ── Page navigation ── */
  function showPage(name) {
    document.querySelectorAll('.page').forEach(p => {
      p.classList.remove('active');
    });
    document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));

    const page = document.getElementById('page-' + name);
    if (page) {
      page.classList.add('active');
      // small trick: re-trigger animation
      page.style.animation = 'none';
      page.offsetHeight; // reflow
      page.style.animation = '';
    }

    if (name === 'home') document.getElementById('nav-index').classList.add('active');
    if (name === 'about') document.getElementById('nav-about').classList.add('active');

    window.scrollTo(0, 0);
  }

  /* ── Open a project ── */
  function openProject(id) {
    const project = PROJECTS.find(p => p.id === id);
    if (!project) return;

    document.getElementById('proj-title').textContent = project.title;
    document.getElementById('proj-desc').textContent = project.description || '';

    const gallery = document.getElementById('h-gallery');
    gallery.innerHTML = '';

    if (!project.photos || project.photos.length === 0) {
      gallery.innerHTML = '<div class="empty-state">No photos yet.</div>';
    } else {
      project.photos.forEach(url => {
        const wrap = document.createElement('div');
        wrap.className = 'h-photo';
        const img = document.createElement('img');
        img.src = url;
        img.alt = project.title;
        img.draggable = false;
        wrap.appendChild(img);
        gallery.appendChild(wrap);
      });
    }

    showPage('project');
  }

  /* ── Drag-to-scroll ── */
  (function () {
    const gallery = document.getElementById('h-gallery');
    let isDown = false, startX, scrollLeft;

    gallery.addEventListener('mousedown', e => {
      isDown = true;
      gallery.classList.add('is-grabbing');
      startX = e.pageX - gallery.offsetLeft;
      scrollLeft = gallery.scrollLeft;
    });
    gallery.addEventListener('mouseleave', () => {
      isDown = false;
      gallery.classList.remove('is-grabbing');
    });
    gallery.addEventListener('mouseup', () => {
      isDown = false;
      gallery.classList.remove('is-grabbing');
    });
    gallery.addEventListener('mousemove', e => {
      if (!isDown) return;
      e.preventDefault();
      const x = e.pageX - gallery.offsetLeft;
      gallery.scrollLeft = scrollLeft - (x - startX) * 1.4;
    });

    // Touch support
    let touchStartX, touchScrollLeft;
    gallery.addEventListener('touchstart', e => {
      touchStartX = e.touches[0].pageX;
      touchScrollLeft = gallery.scrollLeft;
    }, { passive: true });
    gallery.addEventListener('touchmove', e => {
      const dx = e.touches[0].pageX - touchStartX;
      gallery.scrollLeft = touchScrollLeft - dx;
    }, { passive: true });
  })();
</script>

</body>
</html>
